name: Build and validate Chrome extension

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Run static checks and unit tests
        run: npm run check
      - name: Build unpacked Chrome extension
        run: npm run build
      - name: Install Playwright Chromium for extension tests
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium extension smoke tests
        run: npm run test:e2e
      - name: Save installable unpacked build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-blocker-chrome-unpacked
          path: dist/chrome/
          if-no-files-found: error
